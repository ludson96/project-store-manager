services:
  - type: web
    name: store-manager-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:./prisma/store.db"
